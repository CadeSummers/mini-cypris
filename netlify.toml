# Netlify deployment: static Angular build plus one function that proxies CORE.
# Set CORE_API_KEY in the site's environment variables (never in this file).

[build]
  command = "npm run build"
  publish = "dist/mini-cypris/browser"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Single-page app: unknown paths load index.html so the Angular router can
# handle them. /core-api/* is claimed by the function before this applies.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
