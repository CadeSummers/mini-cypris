<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mini-Cypris</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Sets the saved or device theme before first paint, so a dark page never flashes light. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('mini-cypris-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
