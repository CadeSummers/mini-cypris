<div class="switcher" role="group" aria-label="Chart the matching papers by">
  <span class="switcher-label" aria-hidden="true">Chart by</span>
  @for (option of views; track option.view) {
    <button
      type="button"
      [attr.aria-pressed]="view() === option.view"
      (click)="view.set(option.view)"
    >
      {{ option.tab }}
    </button>
  }
</div>

<!--
  Chart.js is the largest dependency, so the year chart loads as its own file,
  straight after the page appears, instead of holding the first paint back.
  Hidden, not removed, so it keeps its Chart.js instance and range choice.
-->
<div [hidden]="view() !== 'year'">
  @defer (on immediate) {
    <app-year-chart
      [series]="yearSeries()"
      [source]="source()"
      [loading]="loading()"
      [selectedYear]="selectedYear()"
      (yearSelected)="yearSelected.emit($event)"
    />
  } @placeholder {
    <div class="year-placeholder" aria-hidden="true"></div>
  }
</div>

@if (rankedText(); as text) {
  <app-ranked-chart
    [heading]="text.heading"
    [noun]="text.noun"
    [caveat]="text.caveat"
    [series]="rankedSeries()"
    [source]="source()"
    [loading]="loading()"
    [selectable]="canPick()"
    [selected]="selected()"
    [hint]="text.hint"
    [pickLabel]="text.pickLabel"
    [metrics]="rankedMetrics()"
    [nameHeading]="text.column"
    (itemSelected)="onPicked($event)"
  />
}
